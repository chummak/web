<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JP Files</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg,
                    #1565c0,
                    #1976d2);
            color: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 15px rgba(0, 0, 0, .12);
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            opacity: .9;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, .06);
        }

        .search {
            flex: 1;
            min-width: 250px;
        }

        .search input,
        .toolbar select {
            width: 100%;
            padding: 11px 13px;
            border:
                1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        .toolbar button {
            border: 0;
            background: #1565c0;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: #0d47a1;
        }

        /* Summary */
        .summary {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .summary-box {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, .06);
        }

        .summary-title {
            font-size: 13px;
            color: #64748b;
        }

        .summary-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, .06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th {
            background: #e2e8f0;
            text-align: left;
            padding: 13px;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-top:
                1px solid #e2e8f0;
            vertical-align: middle;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* File */
        .file-name {
            font-size: 15px;
            font-weight: bold;
            color: #1565c0;
            word-break: break-all;
        }

        .raw-url {
            font-size: 11px;
            color: #64748b;
            max-width: 320px;
            word-break: break-all;
            margin-top: 5px;
        }

        .file-type {
            display: inline-block;
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        .sha {
            font-family: monospace;
            font-size: 12px;
            color: #64748b;
        }

        /* Preview */
        .preview {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
            border:
                1px solid #ddd;
            background: #f8fafc;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-copy {
            background: #1565c0;
            color: white;
        }

        .btn-open {
            background: #475569;
            color: white;
        }

        .btn-download {
            background: #15803d;
            color: white;
        }

        .btn:hover {
            opacity: .85;
        }

        /* Status */
        .loading {
            padding: 50px;
            text-align: center;
            color: #64748b;
        }

        .error {
            padding: 20px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 10px;
        }

        .empty {
            padding: 50px;
            text-align: center;
            color: #64748b;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 22px;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📁 JP Files</h1>
            <p>
                รายการไฟล์จาก GitHub Repository
                <strong>chummak/web / jp</strong>
            </p>
        </div>
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search">
                <input type="text" id="search" placeholder="🔍 ค้นหาชื่อไฟล์..." oninput="renderFiles()">
            </div>
            <select id="sort" onchange="renderFiles()">
                <option value="name">
                    🔤 ชื่อไฟล์
                </option>
                <option value="size">
                    📦 ขนาด
                </option>
            </select>
            <button onclick="loadFiles()">
                🔄 รีเฟรช
            </button>
        </div>
        <!-- Summary -->
        <div class="summary">
            <div class="summary-box">
                <div class="summary-title">
                    จำนวนไฟล์
                </div>
                <div class="summary-value" id="fileCount">
                    -
                </div>
            </div>
            <div class="summary-box">
                <div class="summary-title">
                    ขนาดรวม
                </div>
                <div class="summary-value" id="totalSize">
                    -
                </div>
            </div>
            <div class="summary-box">
                <div class="summary-title">
                    Repository
                </div>
                <div class="summary-value" style="font-size:18px">
                    chummak/web
                </div>
            </div>
        </div>
        <!-- Files -->
        <div id="files">
            <div class="loading">
                ⏳ กำลังโหลดข้อมูลจาก GitHub...
            </div>
        </div>
    </div>
    <script>
        /* =========================================================
           GitHub
        ========================================================= */
        const owner = "chummak";
        const repo = "web";
        const branch = "main";
        const folder = "jp_test";
        const apiUrl =
            `https://api.github.com/repos/${owner}/${repo}/contents/${folder}?ref=${branch}`;
        const rawBase =
            `https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${branch}/${folder}/`;
        /* =========================================================
           Data
        ========================================================= */
        let files = [];
        /* =========================================================
           Load
        ========================================================= */
        async function loadFiles() {
            const container =
                document.getElementById("files");
            container.innerHTML = `
        <div class="loading">
            ⏳ กำลังโหลดข้อมูลจาก GitHub...
        </div>
    `;
            try {
                const response =
                    await fetch(apiUrl, {
                        headers: {
                            "Accept":
                                "application/vnd.github+json"
                        }
                    });
                if (response.status === 403) {
                    throw new Error(
                        "GitHub API ถูกจำกัดการใช้งานชั่วคราว (Rate Limit)"
                    );
                }
                if (!response.ok) {
                    throw new Error(
                        `GitHub API Error: ${response.status}`
                    );
                }
                const data =
                    await response.json();
                /*
                 * เฉพาะไฟล์
                 */
                files =
                    data.filter(
                        file => file.type === "file"
                    );
                /*
                 * เรียงไฟล์ตามข้อมูลที่ GitHub
                 * ส่งกลับมา
                 *
                 * หากต้องการวันที่แก้ไขรายไฟล์
                 * ต้องใช้ Commit API เพิ่ม
                 * ซึ่งจะเพิ่มจำนวน API Request
                 */
                updateSummary();
                renderFiles();
            } catch (error) {
                container.innerHTML = `
            <div class="error">
                ❌ ไม่สามารถโหลดข้อมูลจาก GitHub ได้
                <br><br>
                ${escapeHtml(error.message)}
                <br><br>
                <small>
                    หากขึ้น Rate Limit ให้รอสักครู่
                    แล้วกด 🔄 รีเฟรชอีกครั้ง
                </small>
            </div>
        `;
            }
        }
        /* =========================================================
           Render
        ========================================================= */
        function renderFiles() {
            const container =
                document.getElementById("files");
            const keyword =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase()
                    .trim();
            let result =
                files.filter(file =>
                    file.name
                        .toLowerCase()
                        .includes(keyword)
                );
            const sort =
                document.getElementById("sort").value;
            if (sort === "name") {
                result.sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )
                );
            }
            if (sort === "size") {
                result.sort(
                    (a, b) =>
                        (b.size || 0) -
                        (a.size || 0)
                );
            }
            if (result.length === 0) {
                container.innerHTML = `
            <div class="empty">
                🔍 ไม่พบไฟล์
            </div>
        `;
                return;
            }
            let html = `
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Preview</th>
                        <th>ชื่อไฟล์</th>
                        <th>ประเภท</th>
                        <th>ขนาด</th>
                        <th>SHA</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody>
    `;
            result.forEach(file => {
                const rawUrl =
                    rawBase +
                    encodeURIComponent(file.name);
                const extension =
                    getExtension(file.name);
                const type =
                    getFileType(file.name);
                const preview =
                    isImage(file.name)
                        ?
                        `
                <a
                    href="${rawUrl}"
                    target="_blank"
                >
                    <img
                        src="${rawUrl}"
                        class="preview"
                        loading="lazy"
                        alt="${escapeHtml(file.name)}"
                    >
                </a>
            `
                        :
                        getFileIcon(file.name);
                html += `
            <tr>
                <!-- Preview -->
                <td>
                    ${preview}
                </td>
                <!-- Name -->
                <td>
                    <div class="file-name">
                        ${escapeHtml(file.name)}
                    </div>
                    <div class="raw-url">
                        ${escapeHtml(rawUrl)}
                    </div>
                </td>
                <!-- Type -->
                <td>
                    <span class="file-type">
                        ${escapeHtml(type)}
                    </span>
                    <br>
                    <small>
                        .${escapeHtml(extension)}
                    </small>
                </td>
                <!-- Size -->
                <td>
                    ${formatBytes(file.size)}
                </td>
                <!-- SHA -->
                <td>
                    <span class="sha">
                        ${escapeHtml(
                    file.sha.substring(0, 10)
                )}
                        ...
                    </span>
                </td>
                <!-- Actions -->
                <td>
                    <div class="actions">
                        <button
                            class="btn btn-copy"
                            onclick="copyUrl(this.dataset.url, this)"
                            data-url="${escapeAttribute(rawUrl)}"
                        >
                            📋 คัดลอก
                        </button>
                        <a
                            class="btn btn-open"
                            href="${rawUrl}"
                            target="_blank"
                        >
                            👁️ เปิด
                        </a>
                        <a
                            class="btn btn-download"
                            href="${rawUrl}"
                            download
                        >
                            ⬇️ ดาวน์โหลด
                        </a>
                        <a
                            class="btn btn-open"
                            href="${file.html_url}"
                            target="_blank"
                        >
                            GitHub
                        </a>
                    </div>
                </td>
            </tr>
        `;
            });
            html += `
                </tbody>
            </table>
        </div>
    `;
            container.innerHTML =
                html;
        }
        /* =========================================================
           Summary
        ========================================================= */
        function updateSummary() {
            document
                .getElementById("fileCount")
                .textContent =
                files.length.toLocaleString();
            const total =
                files.reduce(
                    (sum, file) =>
                        sum + (file.size || 0),
                    0
                );
            document
                .getElementById("totalSize")
                .textContent =
                formatBytes(total);
        }
        /* =========================================================
           Copy
        ========================================================= */
        async function copyUrl(url, button) {
            try {
                await navigator
                    .clipboard
                    .writeText(url);
                const old =
                    button.innerHTML;
                button.innerHTML =
                    "✓ คัดลอกแล้ว";
                setTimeout(() => {
                    button.innerHTML =
                        old;
                }, 1500);
            } catch (error) {
                const input =
                    document.createElement("input");
                input.value =
                    url;
                document.body
                    .appendChild(input);
                input.select();
                document.execCommand("copy");
                input.remove();
                button.innerHTML =
                    "✓ คัดลอกแล้ว";
                setTimeout(() => {
                    button.innerHTML =
                        "📋 คัดลอก";
                }, 1500);
            }
        }
        /* =========================================================
           Bytes
        ========================================================= */
        function formatBytes(bytes) {
            if (!bytes) {
                return "0 B";
            }
            const units = [
                "B",
                "KB",
                "MB",
                "GB",
                "TB"
            ];
            const index =
                Math.floor(
                    Math.log(bytes) /
                    Math.log(1024)
                );
            return (
                parseFloat(
                    (
                        bytes /
                        Math.pow(1024, index)
                    ).toFixed(2)
                )
                +
                " " +
                units[index]
            );
        }
        /* =========================================================
           Extension
        ========================================================= */
        function getExtension(name) {
            const parts =
                name.split(".");
            if (parts.length <= 1) {
                return "";
            }
            return parts
                .pop()
                .toLowerCase();
        }
        /* =========================================================
           Type
        ========================================================= */
        function getFileType(name) {
            const ext =
                getExtension(name);
            const types = {
                jpg: "JPEG Image",
                jpeg: "JPEG Image",
                png: "PNG Image",
                gif: "GIF Image",
                webp: "WebP Image",
                svg: "SVG Image",
                html: "HTML",
                css: "CSS",
                js: "JavaScript",
                json: "JSON",
                xml: "XML",
                pdf: "PDF",
                txt: "Text",
                md: "Markdown",
                zip: "ZIP",
                rar: "RAR",
                "7z": "7-Zip",
                mp3: "Audio",
                wav: "Audio",
                mp4: "Video",
                webm: "Video",
                doc: "Word",
                docx: "Word",
                xls: "Excel",
                xlsx: "Excel"
            };
            return (
                types[ext] ||
                "File"
            );
        }
        /* =========================================================
           Image
        ========================================================= */
        function isImage(name) {
            return [
                "jpg",
                "jpeg",
                "png",
                "gif",
                "webp",
                "svg"
            ].includes(
                getExtension(name)
            );
        }
        /* =========================================================
           Icon
        ========================================================= */
        function getFileIcon(name) {
            const ext =
                getExtension(name);
            const icons = {
                pdf: "📕",
                html: "🌐",
                css: "🎨",
                js: "📜",
                json: "🧾",
                txt: "📄",
                md: "📝",
                zip: "🗜️",
                rar: "🗜️",
                mp3: "🎵",
                wav: "🎵",
                mp4: "🎬",
                webm: "🎬",
                doc: "📘",
                docx: "📘",
                xls: "📊",
                xlsx: "📊"
            };
            return `
        <div style="
            font-size:35px;
            text-align:center;
        ">
            ${icons[ext] || "📄"}
        </div>
    `;
        }
        /* =========================================================
           Escape HTML
        ========================================================= */
        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        /* =========================================================
           Escape Attribute
        ========================================================= */
        function escapeAttribute(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }
        /* =========================================================
           Start
        ========================================================= */
        loadFiles();
    </script>
</body>

</html>
